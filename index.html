    <title>Estudio Bíblico</title>
    <script>
      // Aplica tema y tamaño de letra antes de pintar (evita parpadeo)
      try {
        var c = JSON.parse(localStorage.getItem('bible_study_config') || '{}')
        var r = document.documentElement
        r.dataset.theme = c.theme || 'clasico'
        if (c.dark) r.classList.add('dark')
        if (c.fontScale) r.style.setProperty('--fs', c.fontScale)
      } catch (e) {}
    </script>

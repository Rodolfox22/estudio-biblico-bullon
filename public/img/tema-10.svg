<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Escudo firme: Tú tienes un Dios en quien puedes confiar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="t10-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4fb5"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="t10-glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t10-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0fb"/>
    </linearGradient>
    <linearGradient id="t10-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1b46a6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#t10-bg)"/>
  <rect width="200" height="200" fill="url(#t10-glow)"/>

  <!-- rayos suaves -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.25">
    <line x1="100" y1="14" x2="100" y2="26"/>
    <line x1="34" y1="38" x2="42" y2="46"/>
    <line x1="166" y1="38" x2="158" y2="46"/>
  </g>

  <!-- escudo -->
  <path d="M100 32 L158 54 V104 C158 142 132 166 100 180 C68 166 42 142 42 104 V54 Z" fill="url(#t10-shield)"/>
  <path d="M100 46 L146 63 V104 C146 134 125 154 100 166 C75 154 54 134 54 104 V63 Z" fill="url(#t10-inner)"/>

  <!-- marca de confianza -->
  <path d="M78 104 L95 121 L124 86" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

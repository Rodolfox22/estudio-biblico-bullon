<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Amanecer sobre colinas: Podemos comenzar todo de nuevo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="t3-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f6b"/>
      <stop offset="0.55" stop-color="#2f5fc4"/>
      <stop offset="1" stop-color="#8fb8f5"/>
    </linearGradient>
    <radialGradient id="t3-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.45" stop-color="#ffe39a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe39a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t3-h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6fd0"/>
      <stop offset="1" stop-color="#2450a8"/>
    </linearGradient>
    <linearGradient id="t3-h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244a9e"/>
      <stop offset="1" stop-color="#16316d"/>
    </linearGradient>
    <linearGradient id="t3-h3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16316d"/>
      <stop offset="1" stop-color="#0d2050"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#t3-sky)"/>

  <!-- estrellas que se desvanecen -->
  <g fill="#ffffff">
    <circle cx="30" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="62" cy="18" r="1" opacity="0.6"/>
    <circle cx="150" cy="26" r="1.3" opacity="0.7"/>
    <circle cx="176" cy="52" r="1" opacity="0.5"/>
    <circle cx="20" cy="66" r="1" opacity="0.4"/>
  </g>

  <!-- sol naciente -->
  <circle cx="100" cy="128" r="62" fill="url(#t3-sun)"/>
  <circle cx="100" cy="128" r="26" fill="#fff3c4"/>

  <!-- rayos -->
  <g stroke="#fff3c4" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
    <line x1="100" y1="82" x2="100" y2="68"/>
    <line x1="68" y1="94" x2="58" y2="84"/>
    <line x1="132" y1="94" x2="142" y2="84"/>
    <line x1="52" y1="116" x2="38" y2="112"/>
    <line x1="148" y1="116" x2="162" y2="112"/>
  </g>

  <!-- colinas -->
  <path d="M0 138 C40 120 80 128 110 134 C145 141 175 126 200 122 L200 200 L0 200 Z" fill="url(#t3-h1)"/>
  <path d="M0 160 C35 146 70 152 105 160 C140 168 170 154 200 150 L200 200 L0 200 Z" fill="url(#t3-h2)"/>
  <path d="M0 180 C40 170 80 176 120 182 C155 187 180 178 200 174 L200 200 L0 200 Z" fill="url(#t3-h3)"/>

  <!-- brote nuevo -->
  <g transform="translate(100 176)" stroke-linecap="round">
    <path d="M0 0 V-16" stroke="#9be7a8" stroke-width="2.5" fill="none"/>
    <path d="M0 -12 C-10 -14 -13 -22 -12 -26 C-4 -26 0 -20 0 -12 Z" fill="#9be7a8"/>
    <path d="M0 -16 C10 -18 13 -26 12 -30 C4 -30 0 -24 0 -16 Z" fill="#c4f5cc"/>
  </g>
</svg>

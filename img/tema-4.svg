<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Balanza de justicia: Cómo ser justo y librarse de la culpa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="t4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4fb5"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="t4-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#t4-bg)"/>
  <rect width="200" height="200" fill="url(#t4-glow)"/>

  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- base y columna -->
    <rect x="68" y="162" width="64" height="9" rx="4.5" stroke="none"/>
    <rect x="95" y="58" width="10" height="106" rx="3" stroke="none"/>

    <!-- viga -->
    <line x1="40" y1="62" x2="160" y2="62" stroke-width="6" fill="none"/>
    <circle cx="100" cy="52" r="9" stroke="none"/>
    <circle cx="100" cy="52" r="3.5" fill="#2a63cf" stroke="none"/>

    <!-- cadenas izquierda -->
    <g stroke-width="2" fill="none" opacity="0.9">
      <line x1="40" y1="62" x2="20" y2="114"/>
      <line x1="40" y1="62" x2="62" y2="114"/>
      <line x1="160" y1="62" x2="138" y2="114"/>
      <line x1="160" y1="62" x2="180" y2="114"/>
    </g>

    <!-- platillos -->
    <path d="M17 114 H65 a24 24 0 0 1 -48 0 Z" stroke="none"/>
    <path d="M135 114 H183 a24 24 0 0 1 -48 0 Z" stroke="none"/>
  </g>

  <!-- corazón limpio en un platillo -->
  <path d="M41 108 C33 102 30 97 33 93 C36 89 40 90 41 94 C42 90 46 89 49 93 C52 97 49 102 41 108 Z" fill="#ffffff"/>

  <!-- cruz en el otro platillo -->
  <g fill="#ffffff">
    <rect x="156.5" y="86" width="5" height="26" rx="1.5"/>
    <rect x="149" y="93" width="20" height="5" rx="1.5"/>
  </g>
</svg>

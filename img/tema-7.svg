<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Carta con sello de corazón: Una carta de amor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="t7-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4fb5"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="t7-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#t7-bg)"/>
  <rect width="200" height="200" fill="url(#t7-glow)"/>

  <!-- chispas -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="30" cy="40" r="1.8"/>
    <circle cx="172" cy="34" r="1.4"/>
    <circle cx="164" cy="60" r="1"/>
    <circle cx="22" cy="150" r="1.2"/>
  </g>

  <!-- hoja que sale del sobre -->
  <rect x="54" y="42" width="92" height="76" rx="5" fill="#e3eeff"/>
  <g stroke="#7fa6ec" stroke-width="3" stroke-linecap="round">
    <line x1="68" y1="58" x2="132" y2="58"/>
    <line x1="68" y1="70" x2="124" y2="70"/>
    <line x1="68" y1="82" x2="130" y2="82"/>
  </g>

  <!-- sobre -->
  <rect x="34" y="84" width="132" height="86" rx="10" fill="#ffffff"/>
  <path d="M34 94 L100 138 L166 94" fill="none" stroke="#b9cff5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 164 L84 124 M166 164 L116 124" fill="none" stroke="#d6e4fb" stroke-width="3" stroke-linecap="round"/>

  <!-- sello de corazón -->
  <circle cx="100" cy="134" r="17" fill="#ff6b81"/>
  <g transform="translate(100 135) scale(1.05)">
    <path d="M0 8 C-9 2 -12 -3 -9 -7 C-6 -11 -1 -10 0 -5 C1 -10 6 -11 9 -7 C12 -3 9 2 0 8 Z" fill="#ffffff"/>
  </g>
</svg>
